[tool.poetry]
name = "app"
version = "0.1.0"
description = "TrackPulse API"
authors = ["John Smith <john@example.com>"]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.104.1"
uvicorn = "^0.24.0"
sqlalchemy = "^2.0.23"
pydantic = "^2.5.2"
pydantic-settings = "^2.6.1"
psycopg2-binary = "^2.9.10"
aiohttp = "^3.11.9"

[tool.poetry.group.dev.dependencies]
rich = "^13.9.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3 